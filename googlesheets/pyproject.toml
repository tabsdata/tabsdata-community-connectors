[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tabsdata-conn-googlesheets"
version = "0.1.0"
description = "Tabsdata connector that reads publisher tables from and writes subscriber tables to Google Sheets."
requires-python = ">=3.12"
# google-auth, polars and requests are left unpinned so the versions tabsdata
# pins are used
dependencies = [
    "tabsdata>=2.1",
    "google-auth",
    "polars",
    "requests",
]

[project.optional-dependencies]
test = ["pytest"]

# entry point tabsdata uses to discover the connector, same mechanism as its
# built in connectors
[project.entry-points."tabsdatak.connectors"]
src_googlesheets = "tabsdata_googlesheets._plugin:GOOGLE_SHEETS_SRC"
dest_googlesheets = "tabsdata_googlesheets._plugin:GOOGLE_SHEETS_DEST"

[tool.setuptools.packages.find]
where = ["src"]
